server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app https://*.googleapis.com https://firebasestorage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  include /etc/nginx/mime.types;
  types { text/javascript mjs; }

  location / { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
